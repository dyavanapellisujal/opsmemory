[project]
name = "opsmemory"
version = "0.1.0"
description = "OpsMemory — The Operational Memory Layer for Engineering Teams"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "OpsMemory Contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13.9",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "html2text>=2024.2.26",
    "kuzu>=0.11",
    "anthropic>=0.40",
    "mcp>=1.2",
    "pypdf>=5",
    "python-multipart>=0.0.9",
    # Cognee is the central organizational-memory engine (ADR-0002): every
    # write is cognified into its knowledge graph. Core, not optional.
    "cognee>=1.2",
]

[project.optional-dependencies]
# Retained as an alias for older docs/tooling; cognee is now a core dependency.
cognee = ["cognee>=1.2"]

[project.scripts]
opsmemory = "opsmemory.cli.main:app"
opsmemory-mcp = "opsmemory.mcp_server:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "respx>=0.22",
    "types-pyyaml>=6.0",
    "types-beautifulsoup4>=4.12",
    "greenlet>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsmemory"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "D",   # pydocstyle
    "ASYNC", # flake8-async
]
ignore = [
    "D105", # missing docstring in magic method
    "D107", # missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"migrations/**" = ["D"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "kuzu.*", "html2text.*", "cognee.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Cognee (a core dep) triggers pydantic v2 deprecations on import; not ours to fix.
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.coverage.run]
source = ["src/opsmemory"]
