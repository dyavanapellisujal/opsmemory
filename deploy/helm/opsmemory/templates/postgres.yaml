apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsmemory-postgres
  labels:
    app.kubernetes.io/name: opsmemory
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opsmemory
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsmemory
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg15
          env:
            - name: POSTGRES_USER
              value: "opsmemory"
            - name: POSTGRES_PASSWORD
              value: "opsmemory"
            - name: POSTGRES_DB
              value: "opsmemory"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "opsmemory.fullname" . }}-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: opsmemory-postgres
  labels:
    app.kubernetes.io/name: opsmemory
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: opsmemory
    app.kubernetes.io/component: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opsmemory.fullname" . }}-postgres-data
  labels:
    app.kubernetes.io/name: opsmemory
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
